<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>pokemon</title>
</head>

<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #eef2f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
    }

    .pokemon-card {
        background: #ffffff;
        width: 240px;
        padding: 24px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        text-align: center;
        margin-bottom: 20px;
    }

    .pokemon-card img {
        width: 140px;
        height: 140px;
        object-fit: contain;
        transition: transform 0.3s ease;
    }

    .pokemon-card img:hover {
        transform: scale(1.15);
    }

    .pokemon-card h2 {
        margin: 12px 0 0;
        text-transform: capitalize;
        color: #333;
        font-size: 20px;
    }

    #btn-pokemon {
        background-color: #ff5350;
        color: white;
        border: none;
        padding: 12px 28px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(255, 83, 80, 0.3);
        transition: transform 0.2s, background-color 0.2s;
    }

    #btn-pokemon:hover {
        background-color: #e04441;
        transform: translateY(-2px);
    }

    #btn-pokemon:active {
        transform: translateY(0);
    }

    form {
        margin-top: 20px;
    }

    #name-input {
        caret-color: #ff5350;
        border-radius: 5px;
        color: rgb(40, 40, 40);
        border: none;
        padding: 12px 28px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(255, 83, 80, 0.3);
        transition: transform 0.2s, background-color 0.2s;
    }

    #search-btn {
        background-color: #616161;
        border-radius: 5px;
        color: white;
        border: none;
        padding: 12px 28px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(95, 95, 95, 0.3);
        transition: transform 0.2s, background-color 0.2s;
    }

    #reset-btn {
        background-color: #616161;
        border-radius: 5px;
        color: white;
        border: none;
        padding: 12px 28px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(95, 95, 95, 0.3);
        transition: transform 0.2s, background-color 0.2s;
    }
</style>

<body>
    <H1>Pokemon Search</H1>
    <div id="progressX"></div>
    <button id="btn-pokemon">Random new pokemon</button>
    <form id="search" class="search-bar">
        <input type="text" id="name-input" placeholder="Pokemon name" autocomplete="off">
        <button id="search-btn" type="submit">Search</button>
        <button id="reset-btn" type="button">Reset</button>
    </form>

    <script src="script.js"></script>
</body>

</html>
