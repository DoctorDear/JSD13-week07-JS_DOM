<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helldivers Clicker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="app.js" defer></script>

    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>

</head>


<body>
    <header class="bg-zinc-950 px-6 py-4 flex justify-between">

        <!-- logo and name in left side -->

        <div class="flex items-center gap-3 ">
            <div class="w-20 h-20 bg-zinc-950">
                <img src="src/logo.png" alt="Logo" class="w-full h-full object-contain">
            </div>
            <div class="flex flex-col">
                <h1 class="text-lg font-black text-yellow-400 tracking-wider ">
                    STRAT-NET
                </h1>
                <span class="text-xs text-yellow-100/90 tracking-wider  mt-1">
                    SUPER DESTOYER V1.0.4
                </span>
            </div>
        </div>

        <div class="bg-zinc-950 text-yellow-400 px-4 py-2 rounded border border-yellow-500/30 items-center">
            <span id="header-bugs-score">0</span> BUGS
        </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-2">
        <section class="bg-zinc-950">
            <div class="text-yellow-400">
                TERMINID PURGE STATUS
            </div>
        </section>
        <section>
            <div>DEPLOY STRATAGEMS</div>
        </section>
    </main>

</body>

</html>
